<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <title>Två sammanbundna åttondelsnoter</title>

  <!-- Vit cirkulär bakgrund -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Vänster nothuvud (lutad ellips) -->
  <ellipse cx="32" cy="72" rx="9" ry="6.5" transform="rotate(-15 30 72)" fill="#111111"/>

  <!-- Höger nothuvud (lutad ellips) -->
  <ellipse cx="64" cy="66" rx="9" ry="6.5" transform="rotate(-15 62 66)" fill="#111111"/>

  <!-- Vänster notstaf -->
  <rect x="38" y="28" width="3" height="43" fill="#111111"/>

  <!-- Höger notstaf -->
  <rect x="70" y="23" width="3" height="42" fill="#111111"/>

  <!-- Balk (sammanbindande streck, dubbel) -->
  <path d="M38 28 L73 22 L73 30 L38 36 Z" fill="#111111"/>

</svg>
